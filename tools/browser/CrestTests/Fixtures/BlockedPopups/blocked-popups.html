<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automatic Pop-up Fixture</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      background: Canvas;
      color: CanvasText;
      font: 16px system-ui;
      margin: 32px;
      max-width: 640px;
    }
    button, a { display: block; margin: 16px 0; }
    output { display: block; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Automatic Pop-up Fixture</h1>
  <p>
    This models a console launcher that requests its window after an asynchronous
    page action, plus a normal user-activated new-window link.
  </p>
  <a id="open-transient" href="http://localhost:18773/blocked-popups.html?automatic=0&amp;surface=peek">
    Open this fixture in a transient surface
  </a>
  <button id="automatic-popup" type="button">Launch automatic console</button>
  <button id="explicit-window-open" type="button">Open user-activated window</button>
  <a id="explicit-target-blank" href="about:blank#target-blank" target="_blank">Open explicit target blank</a>
  <button id="fixture-window-open" type="button">Open script destination</button>
  <a id="fixture-target-blank" href="popup-destination.html?path=target-blank" target="_blank">
    Open target blank destination
  </a>
  <output id="status" aria-live="polite">Waiting</output>
  <script>
    globalThis.automaticPopupResults = [];
    globalThis.explicitPopupResult = "pending";

    globalThis.attemptAutomaticPopup = label => {
      const popup = window.open("about:blank", `crest-${label}`);
      const result = popup === null ? "null" : "window";
      globalThis.automaticPopupResults.push(result);
      document.querySelector("#status").textContent =
        `${label}: ${result} (${globalThis.automaticPopupResults.length})`;
      return result;
    };

    document.querySelector("#automatic-popup").addEventListener("click", () => {
      setTimeout(() => globalThis.attemptAutomaticPopup("site-action"), 50);
    });

    document.querySelector("#explicit-window-open").addEventListener("click", () => {
      const popup = window.open("about:blank#window-open", "crest-explicit");
      globalThis.explicitPopupResult = popup === null ? "null" : "window";
    });

    document.querySelector("#fixture-window-open").addEventListener("click", () => {
      window.open("popup-destination.html?path=window-open", "crest-fixture");
    });

    if (new URLSearchParams(location.search).get("automatic") !== "0") {
      setTimeout(() => {
        globalThis.attemptAutomaticPopup("initial-1");
        globalThis.attemptAutomaticPopup("initial-2");
        globalThis.attemptAutomaticPopup("initial-3");
      }, 100);
    }
  </script>
</body>
</html>
