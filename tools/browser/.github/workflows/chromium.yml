name: Maintain Chromium fork
run-name: Chromium ${{ inputs.operation || 'check' }}

on:
  push:
    branches: [main]
    paths: [.github/workflows/chromium.yml]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Check upstream, build the pinned engine, or build an upstream update
        type: choice
        default: check
        options: [check, build, update]
      upstream_tag:
        description: Released ungoogled macOS tag. Empty selects the latest eligible release.
        type: string
      allow_major:
        description: Allow a milestone update for manual review
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: crest-chromium-maintenance
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      operation: ${{ steps.plan.outputs.operation }}
      tag: ${{ steps.plan.outputs.tag }}
      major: ${{ steps.plan.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve the trusted integration branch and upstream release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'check' }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
          UPSTREAM_ENABLED: ${{ vars.CHROMIUM_UPSTREAM_ENABLED }}
          BUILD_ENABLED: ${{ vars.CHROMIUM_CI_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'Scripts/control-plane')
          from chromium_fork import select_update, upstream_releases, release_version
          policy = json.loads(Path('CrestEngines/Chromium/fork.json').read_text())
          branch = policy['integrationBranch']
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', f'refs/heads/{branch}'], check=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'FETCH_HEAD'], text=True).strip()
          lock = json.loads(subprocess.check_output(['git', 'show', f'{sha}:CrestEngines/Chromium/source.lock.json'], text=True))
          releases = upstream_releases(policy['upstreamRepository'])
          scheduled = os.environ['GITHUB_EVENT_NAME'] == 'schedule'
          allow_major = policy['automaticMajorUpdates'] or (os.environ['ALLOW_MAJOR'] == 'true' and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch')
          plan = select_update(lock['ungoogledMac']['tag'], releases, allow_major)
          tag = os.environ['UPSTREAM_TAG'] or plan['candidate'] or ''
          operation = os.environ['OPERATION']
          if scheduled:
              # Fixes on the pinned milestone come first. A newer milestone then
              # opens a review PR as well; the publisher still keeps it from
              # shipping on its own unless fork.json allows major updates.
              if not tag and plan['majorReviewRequired']:
                  tag, allow_major = plan['latest'], True
              operation = 'update' if os.environ['UPSTREAM_ENABLED'] == 'true' and tag else 'check'
          if operation == 'update':
              if not tag or release_version(tag) <= release_version(plan['current']):
                  raise SystemExit('No newer eligible upstream release. Use check to inspect milestones requiring review.')
              if not any(r['tag_name'] == tag and not r['draft'] and not r['prerelease'] for r in releases):
                  raise SystemExit('The requested tag is not a published upstream release')
              if release_version(tag)[0] != release_version(plan['current'])[0] and not allow_major:
                  raise SystemExit('Milestone updates require allow_major')
          if operation != 'check' and os.environ['BUILD_ENABLED'] != 'true':
              raise SystemExit('Set CHROMIUM_CI_ENABLED=true after configuring the build Mac')
          major = bool(tag) and release_version(tag)[0] != release_version(plan['current'])[0]
          note = ''
          if operation == 'update':
              # One review per upstream release: later commits on the base must
              # not rebuild it, and a schedule leaves a closed review closed. A
              # schedule also waits while any update is in review, since the next
              # release builds on what that review changes.
              reviews = json.loads(subprocess.check_output(['gh', 'pr', 'list', '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--base', branch, '--state', 'all', '--limit', '1000', '--json', 'headRefName,url,state'], text=True))
              prefix = 'codex/chromium-upstream-'
              existing = [review for review in reviews if review['headRefName'].startswith(prefix) and (
                  review['headRefName'].startswith(f'{prefix}{tag}-') and (review['state'] == 'OPEN' or scheduled)
                  or scheduled and review['state'] == 'OPEN')]
              if existing:
                  note = f"Chromium {tag} is available; {existing[0]['url']} is {existing[0]['state'].lower()}."
                  operation = 'check'
          available = tag or (plan['latest'] if plan['majorReviewRequired'] else '')
          if note:
              pass
          elif operation == 'update':
              note = f'Building Chromium {tag}. A review PR opens once its engine is published.'
          elif operation == 'build':
              note = f"Building and publishing the pinned Chromium {plan['current']} engine."
          elif not available:
              note = f"Chromium {plan['current']} is current."
          elif scheduled:
              note = f'Chromium {available} is available. Scheduled updates are off; set CHROMIUM_UPSTREAM_ENABLED=true.'
          else:
              milestone = release_version(available)[0] != release_version(plan['current'])[0]
              note = f"Chromium {available} is available. Run operation=update{' with allow_major' if milestone else ''} to build it for review."
          print(f'::notice title=Chromium::{note}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'base_sha={sha}\noperation={operation}\ntag={tag}\nmajor={str(major).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(note + '\n\n```json\n' + json.dumps(plan, indent=2) + '\n```\n')
          PY

  engine:
    needs: resolve
    if: needs.resolve.outputs.operation != 'check'
    # Only trusted dispatches and the integration branch reach this persistent Mac.
    # Never add a pull_request or pull_request_target trigger to this job.
    runs-on: [self-hosted, macOS, ARM64, crest-chromium]
    timeout-minutes: 1440
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull_request: ${{ steps.update.outputs.pull_request }}
      head: ${{ steps.update.outputs.head }}
      automatic_release: ${{ steps.update.outputs.automatic_release }}
    env:
      CREST_CHROMIUM_WORKSPACE: ${{ vars.CHROMIUM_WORKSPACE }}
      CHROMIUM_SDK: ${{ vars.CHROMIUM_SDK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check managed build tools
        run: |
          test -n "$CREST_CHROMIUM_WORKSPACE"
          test -d "$CHROMIUM_SDK"
          test -x "$CREST_CHROMIUM_WORKSPACE/tools/bin/python"
          echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
          echo "$CREST_CHROMIUM_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - name: Test fork and release contracts
        run: python -m unittest discover -s Scripts/Tests
      - name: Prepare and compile the engine
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ needs.resolve.outputs.operation }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          MAJOR: ${{ needs.resolve.outputs.major }}
          JOBS: ${{ vars.CHROMIUM_BUILD_JOBS || '4' }}
        run: |
          args=("$OPERATION" --sdk "$CHROMIUM_SDK" --jobs "$JOBS")
          if [[ "$OPERATION" == update ]]; then
            args+=(--tag "$UPSTREAM_TAG")
            if [[ "$MAJOR" == true ]]; then args+=(--allow-major); fi
          fi
          python Scripts/control-plane/chromium-fork.py "${args[@]}"
      - name: Publish the pinned engine
        if: needs.resolve.outputs.operation == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SOURCE: ${{ steps.build.outputs.source }}
        run: |
          python Scripts/control-plane/publish-chromium-engine.py \
            --source "$ENGINE_SOURCE" --ninja "$CREST_CHROMIUM_WORKSPACE/tools/bin/ninja" \
            --repository "$GITHUB_REPOSITORY"
      - name: Publish upstream update for review
        id: update
        if: needs.resolve.outputs.operation == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SOURCE: ${{ steps.build.outputs.source }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          MAJOR: ${{ needs.resolve.outputs.major }}
          CHROMIUM_AUTO_RELEASE: ${{ vars.CHROMIUM_AUTO_RELEASE }}
        run: |
          git config --local credential.https://github.com.helper '!gh auth git-credential'
          args=(--source "$ENGINE_SOURCE" --ninja "$CREST_CHROMIUM_WORKSPACE/tools/bin/ninja"
                --base-sha "$BASE_SHA" --repository "$GITHUB_REPOSITORY")
          if [[ "$MAJOR" == true ]]; then args+=(--major-update); fi
          python Scripts/control-plane/publish-chromium-update.py "${args[@]}"

  promote:
    needs: engine
    if: needs.engine.outputs.automatic_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the verified update and publish it to Development
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_PR: ${{ needs.engine.outputs.pull_request }}
          UPDATE_HEAD: ${{ needs.engine.outputs.head }}
        run: |
          if [[ "$(gh pr view "$UPDATE_PR" --json state --jq .state)" != MERGED ]]; then
            gh pr merge "$UPDATE_PR" --squash --auto --match-head-commit "$UPDATE_HEAD"
          fi
          python3 - <<'PY'
          import base64, json, os, subprocess, time
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()
          for attempt in range(330):
              pr = json.loads(gh('pr', 'view', os.environ['UPDATE_PR'], '--json', 'state,headRefOid,mergeCommit'))
              if pr['headRefOid'] != os.environ['UPDATE_HEAD']:
                  raise SystemExit('The reviewed update changed; refusing to publish')
              if pr['state'] == 'MERGED': break
              if pr['state'] == 'CLOSED': raise SystemExit('Update was closed without merging')
              time.sleep(10)
          else: raise SystemExit('Update is waiting for required checks or review; no release was dispatched')
          repo, sha = os.environ['GH_REPO'], pr['mergeCommit']['oid']
          content = json.loads(gh('api', f'repos/{repo}/contents/CrestEngines/Chromium/fork.json?ref={sha}'))
          policy = json.loads(base64.b64decode(content['content']))
          default = json.loads(gh('api', f'repos/{repo}'))['default_branch']
          branch = policy['integrationBranch']
          if policy['automaticChannel'] != 'development' or branch != default:
              raise SystemExit('Automatic publication requires Development on the default branch')
          # Dispatch explicitly because GITHUB_TOKEN pushes do not trigger workflows.
          # Publish trusted main, including any newer merges that arrived meanwhile.
          gh('workflow', 'run', 'release.yml', '--ref', branch, '-f', 'channel=development')
          PY
