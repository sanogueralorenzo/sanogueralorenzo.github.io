<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Crest</title>
  <desc id="description">A three-color banner beside a dark rail on a warm white field.</desc>
