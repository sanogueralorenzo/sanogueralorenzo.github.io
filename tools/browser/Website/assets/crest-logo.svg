    <clipPath id="app-icon">
      <rect x="40" y="40" width="944" height="944" rx="224"/>
    </clipPath>
    <clipPath id="crest-banner">
      <path d="M337 190H687Q727 190 727 230V774Q727 794 711 805Q698 814 682 803L531 702Q512 689 493 702L342 803Q326 814 313 805Q297 794 297 774V230Q297 190 337 190Z"/>
