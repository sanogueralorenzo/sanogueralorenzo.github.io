<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Crest — Your internet, under your colors.</title>
  <desc id="description">The Crest app icon beside the tagline Your internet, under your colors on a midnight blue field.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.56" stop-color="#152139"/>
      <stop offset="1" stop-color="#203556"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(327 312) rotate(21) scale(510 410)">
      <stop offset="0" stop-color="#78a9c7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#78a9c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="78" height="78" patternUnits="userSpaceOnUse">
      <path d="M78 0H0V78" fill="none" stroke="#fffaf0" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="icon-shadow" x="-35%" y="-35%" width="170%" height="185%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#050a12" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 555 428 402 765 524 1200 352V630H0Z" fill="#78a9c7" opacity="0.055"/>
  <path d="M0 602 386 489 782 604 1200 449V630H0Z" fill="#d2ad58" opacity="0.07"/>

  <image href="crest-icon-512.png" x="88" y="139" width="352" height="352" filter="url(#icon-shadow)"/>

  <g transform="translate(504 126)">
    <text x="0" y="0" fill="#d2ad58" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" letter-spacing="7">CREST BROWSER</text>
    <text fill="#fffaf0" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="72" letter-spacing="-2.5">
      <tspan x="0" y="104">Your internet,</tspan>
      <tspan x="0" y="181" fill="#d2ad58">under your colors.</tspan>
    </text>
    <text x="2" y="245" fill="#fffaf0" fill-opacity="0.69" font-family="Avenir Next, Avenir, sans-serif" font-size="23">Inspired by Arc. Native on Mac, iPad, and iPhone.</text>
    <line x1="2" y1="296" x2="608" y2="296" stroke="#fffaf0" stroke-opacity="0.18"/>
    <text x="2" y="338" fill="#fffaf0" fill-opacity="0.52" font-family="Avenir Next, Avenir, sans-serif" font-size="16" font-weight="700" letter-spacing="3.6">MADE BY AN ARC DIEHARD · BUILT INDEPENDENTLY</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#fffaf0" stroke-opacity="0.08"/>
</svg>
