<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Personal Field Guide</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/crest-logo.svg">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(42px, 8vw, 86px);
        color: #20372d;
        background: #eef2e8;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main { max-width: 950px; margin: auto; }
      .kicker { font-size: 11px; font-weight: 800; letter-spacing: .18em; }
      h1 {
        max-width: 760px;
        margin: 10vh 0 28px;
        font: 500 clamp(54px, 9vw, 96px)/.9 Georgia, serif;
        letter-spacing: -.055em;
      }
      p { max-width: 560px; color: #56675e; font-size: 18px; }
      a {
        display: inline-flex;
        margin-top: 38px;
        padding: 15px 21px;
        border-radius: 999px;
        color: #f5f0e5;
        background: #20372d;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">WEEKEND PLANS · FIELD GUIDE</div>
      <h1>Follow a thought without losing your place.</h1>
      <p>Open the trail note in Peek, decide if it deserves a tab, then return exactly where you were.</p>
      <a href="../trail/">Peek at the trail note →</a>
    </main>
  </body>
</html>
