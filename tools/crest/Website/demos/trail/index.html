<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Saturday Trail Note</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/crest-logo.svg">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(34px, 8vw, 72px);
        color: #20372d;
        background: #eef2e8;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main { max-width: 660px; margin: auto; }
      .kicker { font-size: 11px; font-weight: 800; letter-spacing: .17em; }
      h1 {
        max-width: 580px;
        margin: clamp(48px, 10vh, 90px) 0 22px;
        font: 500 clamp(48px, 9vw, 82px)/.92 Georgia, serif;
        letter-spacing: -.045em;
      }
      p { max-width: 520px; color: #56675e; }
      .card {
        margin-top: 42px;
        padding: 24px;
        border: 1px solid #b9c5b7;
        border-radius: 18px;
        background: rgba(255, 255, 255, .6);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">FIELD NOTE · QUICK LOOK</div>
      <h1>The trail is clear after noon.</h1>
      <p>A compact answer, held in the Personal Space—its cookies, history, and passwords stay right where they belong.</p>
      <div class="card">Saturday · 64° · Pack lunch and the green thermos.</div>
    </main>
  </body>
</html>
