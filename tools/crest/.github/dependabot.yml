version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /HelpCenter
    schedule:
      interval: monthly
    groups:
      help-center:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
