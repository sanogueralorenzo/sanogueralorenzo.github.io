<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser Hooks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><span class="mark" aria-hidden="true">↳</span><div><h1>Browser Hooks</h1><p>Slack · automatic listener</p></div></header>
  <section aria-live="polite">
    <div class="status"><span id="dot"></span><strong id="status">Checking…</strong></div>
    <p id="detail"></p><p id="counts"></p>
  </section>
  <details id="pairing">
    <summary id="pair-label">Pair local bridge</summary>
    <form id="pair-form">
      <label for="code">Pairing code</label>
      <input id="code" type="password" autocomplete="off" placeholder="Code printed by the installer" required>
      <button id="pair-button">Pair local bridge</button>
    </form>
  </details>
  <p id="feedback" role="status"></p>
  <footer>For diagnostics, run <code>slack-hook status</code>. Configure keywords in your local Slack configuration.</footer>
  <script type="module" src="index.js"></script>
</body>
</html>
