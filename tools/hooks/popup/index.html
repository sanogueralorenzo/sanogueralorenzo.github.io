<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser Hooks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="pair-form" aria-label="Slack connection">
    <img src="../slack/icon.png" width="20" height="20" alt="">
    <span>Slack</span>
    <span id="dot" role="status" aria-label="Checking Slack connection" title="Checking Slack connection"></span>
    <input id="code" type="password" aria-label="Slack pairing code" aria-describedby="feedback" autocomplete="off" placeholder="Pairing code" title="Paste the code printed by the installer and press Enter" required>
  </form>
  <p id="feedback" role="status"></p>
  <script type="module" src="index.js"></script>
</body>
</html>
