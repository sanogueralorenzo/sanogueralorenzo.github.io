<!doctype html>
<meta charset="utf-8">
<title>Rewrite selection fixture</title>
<style>body{font:16px system-ui;max-width:700px;margin:64px auto}textarea,[contenteditable]{font:16px system-ui;width:100%;padding:16px;box-sizing:border-box;border:1px solid #888;border-radius:6px}textarea{height:120px}</style>
<h1>Rewrite selection fixture</h1>
<p>Disposable local text. Select the sentence below to test Rewrite.</p>
<label for="plain">Text area</label>
<textarea id="plain">She go to the library yesterday.</textarea>
<p>Contenteditable</p>
<div contenteditable="true" role="textbox" aria-label="Rich editor">She go to the library yesterday.</div>
<p id="readonly">Read-only paragraph: She go to the library yesterday.</p>
